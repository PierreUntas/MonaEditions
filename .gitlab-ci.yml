# GitLab CI — mirrors .github/workflows/ci.yml for this repository.
#
# `npm ci` installs strictly from the lockfiles, so a lockfile has to be
# generated by an npm whose resolution this image agrees with. node:22 ships
# npm 10; a lockfile written by npm 11 prunes optional WASM entries that npm 10
# still expects, and `npm ci` then refuses to run. Regenerate with
# `docker run --rm -v "$PWD":/app -w /app node:22 npm install --package-lock-only`
# after changing dependencies on a machine running a newer npm.
#
# The jobs here need no project variables: the contract tests run against
# Hardhat's in-process network, and the placeholder RPC URLs below exist only
# to satisfy Hardhat's config validation, which checks every declared network
# even when the tests use none of them. The frontend job stops at lint and
# typecheck — the production build runs on Vercel for every push, with the real
# environment variables.

stages:
  - test

default:
  image: node:22

contracts:
  stage: test
  variables:
    SEPOLIA_RPC_URL: "https://rpc.invalid/placeholder"
    BASE_RPC_URL: "https://rpc.invalid/placeholder"
    BASE_SEPOLIA_RPC_URL: "https://rpc.invalid/placeholder"
  cache:
    key:
      files:
        - contracts/package-lock.json
    paths:
      - contracts/node_modules/
  before_script:
    - cd contracts
    - npm ci
  script:
    - npx hardhat compile
    - npx hardhat test

frontend:
  stage: test
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run lint
    - npx tsc --noEmit
